[project]
name = "clip-match-gradcam"
version = "0.1.0"
description = "CLIP-based image-text match classification (2-class) with Grad-CAM heatmaps"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision",
    "transformers>=4.40",
    "grad-cam>=1.5",
    "pillow",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "opencv-python-headless",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.uv]
# CUDA 版 torch を使う場合は下の index を有効化して cu121 などに変更する
# [[tool.uv.index]]
# name = "pytorch-cu121"
# url = "https://download.pytorch.org/whl/cu121"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu121" }
# torchvision = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmatch"]

[tool.ruff]
line-length = 100

[project]
name = "clip-match-gradcam"
version = "0.1.0"
description = "CLIP-based image-text match classification (2-class) with Grad-CAM heatmaps"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision",
    "transformers>=4.40",
    "grad-cam>=1.5",
    "pillow",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "opencv-python-headless",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# --- PyTorch の CUDA ビルドを使う設定（既定: cu128） ---
# CPU だけで動かしたい場合はこのブロックを丸ごとコメントアウトして `uv sync` する．
# 別の CUDA バージョンにしたい場合は cu128 を cu121 / cu124 などに置き換える．
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmatch"]

[tool.ruff]
line-length = 100
